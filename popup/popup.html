<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>ViewDigest</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="app-title">
        <img src="../icons/icon32.png" alt="" class="app-logo" />
        <span>ViewDigest</span>
      </div>
      <button id="open-options-btn" class="icon-btn" title="설정 열기" type="button">⚙</button>
    </header>

    <div class="analyze-bar">
      <button id="start-analyze-btn" class="primary-btn" type="button" disabled>
        🔍 지금 분석하기
      </button>
      <p id="idle-hint" class="state-hint"></p>
    </div>

    <nav class="tabs" role="tablist">
      <button class="tab-btn active" data-tab="history" role="tab" type="button">히스토리</button>
      <button class="tab-btn" data-tab="usage" role="tab" type="button">사용량</button>
    </nav>

    <main class="panels">
      <!-- 히스토리 탭 -->
      <section id="history-panel" class="panel active" data-panel="history">
        <div id="history-empty" class="state-view hidden">
          <p class="state-message">아직 분석한 영상이 없습니다.</p>
        </div>
        <ul id="history-list" class="history-list scroll-area"></ul>
      </section>

      <!-- 사용량 탭 -->
      <section id="usage-panel" class="panel" data-panel="usage">
        <div class="usage-grid">
          <div class="usage-stat">
            <span class="usage-stat-label">오늘 분석</span>
            <span class="usage-stat-value" id="usage-today-count">-</span>
          </div>
          <div class="usage-stat">
            <span class="usage-stat-label">이번 달 분석</span>
            <span class="usage-stat-value" id="usage-month-count">-</span>
          </div>
          <div class="usage-stat">
            <span class="usage-stat-label">오늘 예상 비용</span>
            <span class="usage-stat-value" id="usage-today-cost">-</span>
          </div>
          <div class="usage-stat">
            <span class="usage-stat-label">이번 달 예상 비용</span>
            <span class="usage-stat-value" id="usage-month-cost">-</span>
          </div>
        </div>

        <div class="rate-limit-section">
          <div class="rate-limit-label">
            <span>오늘의 일일 한도</span>
            <span id="rate-limit-text">- / -</span>
          </div>
          <div class="rate-limit-bar">
            <div class="rate-limit-fill" id="rate-limit-fill"></div>
          </div>
          <p id="rate-limit-status" class="state-hint"></p>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
