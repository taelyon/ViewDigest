<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title data-i18n="resultsPageTitle">View Digest 분석</title>
  <script src="../utils/theme-init.js"></script>
  <link rel="stylesheet" href="results.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="app-title">
        <img src="../icons/icon32.png" alt="" class="app-logo" />
        <span>View Digest</span>
      </div>
    </header>

    <main>
      <div class="result-meta">
        <h1 class="result-title" id="result-title" data-i18n="resultsPreparing">분석 준비 중...</h1>
        <div class="result-submeta hidden" id="result-meta-line"></div>
      </div>

      <div id="status-view" class="state-view">
        <div class="spinner" aria-hidden="true"></div>
        <p class="state-message" id="status-text" data-i18n="resultsStarting">시작하는 중...</p>
        <p class="state-hint hidden" id="status-estimate"></p>
      </div>

      <div id="error-view" class="state-view hidden">
        <p class="state-message error-message" id="error-text"></p>
        <div id="error-actions" class="error-actions hidden"></div>
      </div>

      <div id="sample-notice" class="saved-notice sample-notice hidden">
        <span data-i18n="resultsSampleNotice">예시 리포트입니다. 내가 고른 영상으로 이런 리포트를 받으려면 Gemini API 키를 등록하세요.</span>
        <button id="sample-guide-btn" class="primary-btn" type="button" data-i18n="resultsOpenGuide">시작 가이드 열기</button>
      </div>

      <div id="saved-notice" class="saved-notice hidden">
        <span id="saved-notice-text"></span>
        <button id="notice-reanalyze-btn" class="secondary-btn" type="button" data-i18n="resultsReanalyze">🔄 다시 분석</button>
      </div>

      <div id="result-content" class="markdown-body hidden"></div>
      <p id="print-source" class="print-only"></p>

      <div id="result-actions" class="result-actions hidden">
        <button id="copy-btn" class="secondary-btn" type="button" data-i18n="resultsCopy" data-i18n-title="resultsCopyTitle">📋 복사</button>
        <button id="download-btn" class="secondary-btn" type="button" data-i18n="resultsDownload">⬇️ Markdown 다운로드</button>
        <button id="obsidian-btn" class="secondary-btn" type="button" data-i18n="resultsDownloadObsidian" data-i18n-title="resultsDownloadObsidianTitle">🗂️ Obsidian용</button>
        <button id="print-btn" class="secondary-btn" type="button" data-i18n="resultsPrint" data-i18n-title="resultsPrintTitle">🖨️ PDF·인쇄</button>
        <button id="reanalyze-btn" class="secondary-btn hidden" type="button" data-i18n="resultsReanalyze">🔄 다시 분석</button>
      </div>

      <section id="qa-section" class="qa-section hidden" aria-labelledby="qa-title">
        <h2 id="qa-title" class="qa-title" data-i18n="qaTitle">💬 영상에 질문하기</h2>
        <p class="qa-desc" data-i18n="qaDesc">리포트를 바탕으로 답합니다.</p>
        <ul id="qa-list" class="qa-list"></ul>
        <form id="qa-form" class="qa-form">
          <textarea id="qa-input" class="qa-input" rows="2" maxlength="1000" data-i18n-placeholder="qaPlaceholder"></textarea>
          <div class="qa-form-row">
            <label class="qa-video-toggle">
              <input type="checkbox" id="qa-use-video" />
              <span data-i18n="qaUseVideo">영상 전체에서 찾기</span>
            </label>
            <span id="qa-cost-hint" class="qa-cost-hint"></span>
            <button id="qa-submit" class="primary-btn" type="submit" data-i18n="qaSubmit">질문하기</button>
          </div>
          <p id="qa-error" class="qa-error hidden" role="alert"></p>
        </form>
      </section>
    </main>
  </div>

  <aside id="review-card" class="review-card hidden" role="dialog" aria-labelledby="review-card-title">
    <p id="review-card-title" class="review-card-title" data-i18n="reviewTitle">View Digest가 도움이 되셨나요?</p>
    <p id="review-card-text" class="review-card-text"></p>
    <div class="review-card-actions">
      <button id="review-now-btn" class="primary-btn" type="button" data-i18n="reviewNow">⭐ 리뷰 남기기</button>
      <button id="review-later-btn" class="secondary-btn" type="button" data-i18n="reviewLater">나중에</button>
      <button id="review-never-btn" class="review-never-btn" type="button" data-i18n="reviewNever">다시 보지 않기</button>
    </div>
  </aside>
  <script type="module" src="results.js"></script>
</body>
</html>
