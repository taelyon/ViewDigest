<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title data-i18n="resultsPageTitle">ViewDigest 분석</title>
  <link rel="stylesheet" href="results.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="app-title">
        <img src="../icons/icon32.png" alt="" class="app-logo" />
        <span>ViewDigest</span>
      </div>
    </header>

    <main>
      <div class="result-meta">
        <h1 class="result-title" id="result-title" data-i18n="resultsPreparing">분석 준비 중...</h1>
        <div class="result-submeta hidden" id="result-meta-line"></div>
      </div>

      <div id="status-view" class="state-view">
        <div class="spinner" aria-hidden="true"></div>
        <p class="state-message" id="status-text" data-i18n="resultsStarting">시작하는 중...</p>
      </div>

      <div id="error-view" class="state-view hidden">
        <p class="state-message error-message" id="error-text"></p>
      </div>

      <div id="saved-notice" class="saved-notice hidden">
        <span id="saved-notice-text"></span>
        <button id="notice-reanalyze-btn" class="secondary-btn" type="button" data-i18n="resultsReanalyze">🔄 다시 분석</button>
      </div>

      <div id="result-content" class="markdown-body hidden"></div>

      <div id="result-actions" class="result-actions hidden">
        <button id="copy-btn" class="secondary-btn" type="button" data-i18n="resultsCopy">📋 복사</button>
        <button id="download-btn" class="secondary-btn" type="button" data-i18n="resultsDownload">⬇️ Markdown 다운로드</button>
        <button id="reanalyze-btn" class="secondary-btn hidden" type="button" data-i18n="resultsReanalyze">🔄 다시 분석</button>
      </div>
    </main>
  </div>

  <aside id="review-card" class="review-card hidden" role="dialog" aria-labelledby="review-card-title">
    <p id="review-card-title" class="review-card-title" data-i18n="reviewTitle">ViewDigest가 도움이 되셨나요?</p>
    <p id="review-card-text" class="review-card-text"></p>
    <div class="review-card-actions">
      <button id="review-now-btn" class="primary-btn" type="button" data-i18n="reviewNow">⭐ 리뷰 남기기</button>
      <button id="review-later-btn" class="secondary-btn" type="button" data-i18n="reviewLater">나중에</button>
      <button id="review-never-btn" class="review-never-btn" type="button" data-i18n="reviewNever">다시 보지 않기</button>
    </div>
  </aside>
  <script type="module" src="results.js"></script>
</body>
</html>
