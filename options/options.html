<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>LilysAI Style YouTube Analyzer - 설정</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <div id="app">
    <header class="page-header">
      <img src="../icons/icon48.png" alt="" class="page-logo" />
      <div>
        <h1>LilysAI Style YouTube Analyzer</h1>
        <p class="page-subtitle">설정</p>
      </div>
    </header>

    <!-- Gemini API 키 -->
    <section class="card">
      <h2>Gemini API 키</h2>
      <p class="card-desc">
        <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener noreferrer"
          >Google AI Studio</a
        >에서 발급받은 API 키를 입력하세요. 키는 기기 간 동기화되는 저장소(chrome.storage.sync)에 저장됩니다.
      </p>

      <p class="api-key-status" id="api-key-status">확인 중...</p>

      <div class="input-row">
        <input
          type="password"
          id="api-key-input"
          class="text-input"
          placeholder="새 API 키를 입력하세요"
          autocomplete="off"
        />
        <button id="toggle-visibility-btn" class="icon-btn" type="button" title="키 표시/숨기기">👁</button>
      </div>

      <div class="button-row">
        <button id="save-api-key-btn" class="primary-btn" type="button">API 키 저장</button>
        <button id="test-api-key-btn" class="secondary-btn" type="button">연결 테스트</button>
      </div>
      <p id="api-key-feedback" class="feedback"></p>
      <p id="test-result" class="feedback"></p>
    </section>

    <!-- 분석 설정 -->
    <section class="card">
      <h2>분석 설정</h2>

      <label class="field-label" for="model-select">사용할 모델</label>
      <select id="model-select" class="text-input">
        <option value="gemini-3.7-flash">Gemini 3.7 Flash (기본, 균형)</option>
        <option value="gemini-3.8-flash">Gemini 3.8 Flash (고성능)</option>
        <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash Lite (경제형)</option>
      </select>

      <label class="field-label" for="daily-limit-input">하루 최대 분석 횟수</label>
      <input type="number" id="daily-limit-input" class="text-input" min="1" max="200" step="1" />

      <div class="button-row">
        <button id="save-settings-btn" class="primary-btn" type="button">설정 저장</button>
      </div>
      <p id="settings-feedback" class="feedback"></p>
    </section>

    <!-- 사용량 요약 -->
    <section class="card">
      <h2>사용량 요약</h2>
      <div class="usage-grid">
        <div class="usage-stat">
          <span class="usage-stat-label">오늘 분석</span>
          <span class="usage-stat-value" id="usage-today-count">-</span>
        </div>
        <div class="usage-stat">
          <span class="usage-stat-label">이번 달 분석</span>
          <span class="usage-stat-value" id="usage-month-count">-</span>
        </div>
        <div class="usage-stat">
          <span class="usage-stat-label">오늘 예상 비용</span>
          <span class="usage-stat-value" id="usage-today-cost">-</span>
        </div>
        <div class="usage-stat">
          <span class="usage-stat-label">이번 달 예상 비용</span>
          <span class="usage-stat-value" id="usage-month-cost">-</span>
        </div>
      </div>
      <div class="rate-limit-section">
        <div class="rate-limit-label">
          <span>오늘의 일일 한도</span>
          <span id="rate-limit-text">- / -</span>
        </div>
        <div class="rate-limit-bar">
          <div class="rate-limit-fill" id="rate-limit-fill"></div>
        </div>
      </div>
    </section>

    <!-- 히스토리 관리 -->
    <section class="card">
      <h2>히스토리 관리</h2>
      <p class="card-desc">저장된 분석 히스토리: <strong id="history-count">-</strong>개</p>
      <div class="button-row">
        <button id="clear-history-btn" class="danger-btn" type="button">히스토리 전체 삭제</button>
      </div>
      <p id="history-feedback" class="feedback"></p>
    </section>
  </div>
  <script type="module" src="options.js"></script>
</body>
</html>
